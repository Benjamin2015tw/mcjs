<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web version of Minecraft - 網頁版 Minecraft 多版本整理</title>
<style>
  body { font-family: 'Microsoft JhengHei', sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .wrap { background: #c6c6c6; color: #222; border: 4px solid #000; box-shadow: inset 4px 4px 0 #fff, inset -4px -4px 0 #555; padding: 20px; max-width: 600px; width: 100%; }
  h1, h2 { text-align: center; text-shadow: 2px 2px 0 #fff; margin: 10px 0; }
  .notice { background: #8b8b8b; color: #fff; text-shadow: 1px 1px 0 #333; border: 3px solid #373737; padding: 12px; margin-bottom: 15px; font-size: 14px; line-height: 1.6; }
  .btn { display: block; background: #727272; color: #fff; text-decoration: none; border: 3px solid #000; box-shadow: inset 3px 3px 0 #aaa, inset -3px -3px 0 #444; padding: 12px 15px; margin-bottom: 10px; text-shadow: 2px 2px 0 #333; }
  .btn:hover { background: #3c8527; box-shadow: inset 3px 3px 0 #6cc349, inset -3px -3px 0 #2a641c; color: #ffffa0; }
  .title { font-weight: bold; font-size: 16px; display: block; margin-bottom: 4px; }
  .desc { font-size: 12px; color: #e2e8f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Web version of Minecraft</h1>
  <div class="notice"><strong>即將上架：</strong>Eaglercraft 1.9.4、1.16.1（會取代 1.16.5）<br><strong>公告網：</strong>關注公告網以獲得最新消息（密碼已貼群組）</div>
  <h2>遊玩 Play</h2>
  <!-- 13個遊戲版本按鈕內容，請參考完整原始碼設定 -->
  <a class="btn" href="https://1.mcjslink.144449.xyz/1.8.8wasm"><span class="title">EaglercraftX 1.8.8 WASM</span>...</a>
  <!-- (其餘版本按鈕包含 1.12.2 至 26.3 版本) -->
  <h2>已知 Bug 與注意事項</h2>
  <div class="notice">
    <!-- 已知 Bug 相關細節請參考原始設定檔 -->

    <strong>聲明：</strong>本網站僅為整理網頁版 MC 連結，所有權歸上游作者所有。
  </div>
</div>

</html>
