<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網頁版 Minecraft 多版本整理</title>
<meta http-equiv="refresh" content="10;url=https://lit.link/zh-tw/Web_version_of_Minecraft">
<style>
  body {
    font-family: sans-serif;
    background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-CUfCTyaxP0xctoP5cpnlIC38N7XpbBgNy2-Ic8Px3XHUhvCwzGwDbMzw&s=10') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  .box {
    background: rgba(26, 32, 44, 0.85);
    backdrop-filter: blur(4px);
    padding: 30px;
    border-radius: 12px;
    max-width: 500px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  #count { font-size: 26px; font-weight: bold; color: #48bb78; }
</style>
</head>
<body>
  <div class="box">
    <h1>網頁版 Minecraft 多版本整理</h1>
    <p>將在 <span id="count">10</span> 秒後自動跳轉至遊戲列表...</p>
  </div>
  <script>
    let t = 10;
    setInterval(() => {
      t--;
      if (t >= 0) document.getElementById("count").innerText = t;
      if (t === 0) location.replace("https://lit.link/zh-tw/Web_version_of_Minecraft");
    }, 1000);
  </script>
</body>
</html>
